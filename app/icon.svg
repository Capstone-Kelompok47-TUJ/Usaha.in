<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="favBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E40AF" />
      <stop offset="50%" stopColor="#4338CA" />
      <stop offset="100%" stopColor="#6D28D9" />
    </linearGradient>

    <!-- Outer Highlight Border -->
    <linearGradient id="favBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#93C5FD" stopOpacity="0.7" />
      <stop offset="50%" stopColor="#A5B4FC" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.1" />
    </linearGradient>

    <!-- Foundation U Gradient -->
    <linearGradient id="favFoundationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="60%" stopColor="#F8FAFC" />
      <stop offset="100%" stopColor="#E2E8F0" />
    </linearGradient>

    <!-- Growth Arrow Gradient -->
    <linearGradient id="favArrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#60A5FA" />
      <stop offset="100%" stopColor="#818CF8" />
    </linearGradient>
  </defs>

  <!-- 1. Base Squircle Container -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="12" fill="url(#favBadgeGrad)" />

  <!-- 2. Sleek Glass Border -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="12" stroke="url(#favBorderGrad)" stroke-width="1.2" />

  <!-- 3. Subtle Ambient Light Reflection -->
  <path d="M3 14C3 8.47715 7.47715 4 13 4H35C40.5228 4 45 8.47715 45 14V16C31 16 17 19 3 26V14Z" fill="white" fill-opacity="0.07" />

  <!-- 4. The Foundation "U" Curve -->
  <path
    d="M14 14V25C14 30.5228 18.4772 35 24 35C29.5228 35 34 30.5228 34 25V21"
    stroke="url(#favFoundationGrad)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 5. Ascending Growth Dynamic Arrow (45-degree angle pointing top-right) -->
  <path
    d="M24 23L34.5 12.5"
    stroke="url(#favArrowGrad)"
    stroke-width="3.8"
    stroke-linecap="round"
  />
  <path
    d="M27.5 12.5H34.5V19.5"
    stroke="url(#favArrowGrad)"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 6. Central Synchronization Hub Node -->
  <circle cx="24" cy="23" r="2.4" fill="#FFFFFF" />
  <circle cx="24" cy="23" r="3.8" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.8" />
</svg>
